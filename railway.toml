[[services]]
name = "web"
source = "./apps/web"
buildCommand = "npm run build"
startCommand = "npm start"
healthcheckPath = "/"

[[services]]
name = "api"
source = "./apps/api"
buildCommand = "pip install -r requirements.txt"
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"